name: Snakemake Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'Data/Raw/orders.csv'
      - 'Data/Raw/*.csv'  # Catches any new CSV files
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  process-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: List modified files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "Data/Raw/"
          
      - name: Run Snakemake pipeline
        run: |
          snakemake --cores 1
          
      - name: Upload processed database
        uses: actions/upload-artifact@v3
        with:
          name: analytics-db
          path: data/processed/analytics.sqlite