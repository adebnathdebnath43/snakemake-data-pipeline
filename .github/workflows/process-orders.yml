name: Process new order files

on:
  push:
    branches: [ main ]
    paths:
      - 'Data/Raw/**'
  workflow_dispatch: {}

jobs:
  ETL-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ensure compatible pulp before snakemake imports it
          pip install "pulp==2.7.0"
          pip install -r requirements.txt

      - name: List changed files
        run: |
          echo "Changed files:" && git --no-pager diff --name-only ${{ github.event.before }} ${{ github.sha }} | sed -n '1,200p'
      
      - name: Remove existing processed DB (force rebuild)
        run: |
          rm -f Data/processed/*.sqlite || true

      - name: Run Snakemake pipeline
        run: |
          # dry-run first
          python -m snakemake -n --cores 1 || true
          # actual run
          python -m snakemake --cores 1

      - name: Upload processed DB
        uses: actions/upload-artifact@v4
        with:
          name: analytics-db
          path: Data/processed/*.sqlite
